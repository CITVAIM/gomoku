<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>五子棋</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="modes">
        <button id="mode-ai" class="seg active">人机对战</button>
        <button id="mode-2p" class="seg">双人对战</button>
      </div>
      <div class="actions">
        <button id="undo" class="icon-btn" title="悔棋">↶</button>
        <button id="restart" class="icon-btn" title="重新开始">↻</button>
      </div>
    </header>

    <div class="status">
      <span class="turn" id="turn-dot"></span>
      <span id="status-text">黑棋先行</span>
    </div>

    <div class="stage">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
